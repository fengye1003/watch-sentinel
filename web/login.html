<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141218">
<title>守望 · 验证</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="auth-body">
<svg class="sprite" aria-hidden="true">
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5.5v6.2c0 5 3.4 9.1 8 10.3 4.6-1.2 8-5.3 8-10.3V5.5L12 2Zm0 4.2 4.7 2v3.5c0 3.2-2 5.9-4.7 6.9-2.7-1-4.7-3.7-4.7-6.9V8.2l4.7-2Z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><path d="M17 9h-1V7a4 4 0 0 0-8 0v2H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-7-2a2 2 0 0 1 4 0v2h-4V7Zm2 12a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></symbol>
</svg>

<main class="auth-card">
  <div class="auth-logo"><svg><use href="#i-lock"/></svg></div>
  <h1>守望<span>SENTINEL</span></h1>
  <p class="auth-sub">
    输入验证器里的 6 位动态码
    <small>与 DSH 面板使用的是同一个验证器</small>
  </p>
  <form id="loginForm" autocomplete="off">
    <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code"
           maxlength="6" placeholder="000000" aria-label="6 位动态码" autofocus>
    <button id="submitBtn" class="filled-btn" type="submit">验证并进入</button>
  </form>
  <p id="error" class="auth-error" role="alert"></p>
  <p class="auth-foot">验证通过后本设备 30 天内免验证</p>
</main>

<script>
(() => {
  const saved = localStorage.getItem("sentinel-theme");
  const mode = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.dataset.theme = mode;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = mode === "dark" ? "#141218" : "#FEF7FF";

  const input = document.getElementById("code");
  const error = document.getElementById("error");
  const button = document.getElementById("submitBtn");

  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "").slice(0, 6);
    error.textContent = "";
  });

  async function submit(event) {
    event.preventDefault();
    const code = input.value.trim();
    if (code.length !== 6) {
      error.textContent = "需要 6 位数字";
      return;
    }
    button.disabled = true;
    button.textContent = "验证中…";
    try {
      const resp = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const data = await resp.json().catch(() => ({}));
      if (resp.ok && data.ok) {
        const next = new URLSearchParams(location.search).get("next") || "/";
        location.replace(next.startsWith("/") ? next : "/");
        return;
      }
      if (resp.status === 429) {
        error.textContent = `尝试太频繁，请 ${data.retry_after || 60} 秒后再试`;
      } else {
        error.textContent = "验证码不正确，或已过期";
      }
      input.value = "";
      input.focus();
    } catch (err) {
      error.textContent = "网络错误，请重试";
    } finally {
      button.disabled = false;
      button.textContent = "验证并进入";
    }
  }

  document.getElementById("loginForm").addEventListener("submit", submit);
})();
</script>
</body>
</html>
